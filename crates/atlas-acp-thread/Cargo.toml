[package]
name = "atlas-acp-thread"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to an exact version. This crate codes against the 2.0 schema revision;
# building it on an older schema would mean re-deriving every place the types
# moved between 1.4 and 2.0.
#
# The pin's original justification — "nothing else links this crate" — expired.
# Seven packages link it today: atlas-agent-manager, atlas-agent-servers,
# atlas-agent-store, atlas-agent-delta, atlas-native-agent,
# atlas-thread-metadata, and src-tauri. So the pin no longer isolates anything;
# it now FIXES the schema revision for everything downstream of this crate, and
# moving it is a change to all seven. What keeps that tractable is that each
# `crates/*` package has its own lockfile, so a package that links neither this
# crate nor those seven still resolves independently.
agent-client-protocol = { version = "=2.0.0", features = ["unstable"] }
atlas-terminal = { path = "../atlas-terminal" }
anyhow = "1"
chrono = "0.4"
indexmap = "2"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1.44"

[features]
# `test_support::FakeConnection`, the one scripted `AgentConnection` every
# crate's tests share. Turned on under `[dev-dependencies]` only, here and in
# every consumer, so no shipping build compiles it.
test-support = []

[dev-dependencies]
# This crate's own integration tests use the fake too.
atlas-acp-thread = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["full", "test-util"] }

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
