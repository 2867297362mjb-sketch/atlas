[package]
name = "atlas-gitdiff"
version = "0.1.0"
edition = "2021"
description = "The editor gutter's line status for Atlas: parses a file's unified diff and tells its added lines from its changed ones (line pairing vendored from dandavison/delta, MIT)."

[lib]
name = "atlas_gitdiff"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Tokenization for the line pairing + the vendored delta `edits`/`align` modules.
regex = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
# Reads `src/features/git/lib/unified-diff.fixtures.json`, the cases this
# parser shares with the TypeScript ones.
serde_json = "1"

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
